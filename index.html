<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>月照財來｜神諭殿堂</title>
<style>
:root{
  color-scheme:dark;
  --bg:#090806;--panel:#100e0a;--panel2:#17130d;
  --gold:#c4a36b;--gold2:#8f7044;--pale:#e8dcc5;
  --muted:#a99a80;--line:rgba(196,163,107,.28);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);scroll-padding-top:86px}
body{margin:0;background:var(--bg);color:var(--pale);font-family:var(--serif);min-width:320px}
a{color:inherit}
button{font:inherit}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--gold);color:#100d08;padding:10px 16px}
.skip:focus{left:12px}
.site-header{
  position:sticky;top:0;z-index:20;height:68px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:0 clamp(18px,5vw,76px);
  background:rgba(9,8,6,.91);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(196,163,107,.16)
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;white-space:nowrap}
.brand-mark{width:30px;height:30px;border:1px solid var(--gold2);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:15px}
.brand-name{font-size:14px;letter-spacing:.28em;color:var(--pale)}
.nav{display:flex;align-items:center;gap:clamp(14px,3vw,38px)}
.nav a{font:11px var(--sans);letter-spacing:.18em;text-decoration:none;color:var(--muted);transition:color .2s}
.nav a:hover,.nav a:focus-visible{color:var(--gold)}
.menu-toggle{display:none;background:none;border:1px solid var(--line);color:var(--gold);padding:8px 11px}
.hero{width:100%;background:#090806;position:relative;overflow:hidden}
.hero-inner{max-width:1120px;margin:0 auto;position:relative;line-height:0}
.hero-art{display:block;width:100%;height:auto}
.hero-caption{
  position:absolute;left:50%;bottom:2.3%;transform:translateX(-50%);
  width:max-content;max-width:90%;text-align:center;line-height:1.8;
  color:rgba(232,220,197,.72);font:10px var(--sans);letter-spacing:.28em;
  text-shadow:0 1px 12px #000;pointer-events:none
}
/* Transparent door targets align with the three doors in the original artwork. */
.door-target{position:absolute;top:63.5%;height:18%;width:30%;border:1px solid transparent;background:transparent;cursor:pointer;border-radius:4px;transition:background .2s,border-color .2s,box-shadow .2s}
.door-target:hover,.door-target:focus-visible{background:rgba(196,163,107,.10);border-color:rgba(218,185,126,.72);box-shadow:0 0 28px rgba(196,163,107,.18);outline:none}
.door-target span{position:absolute;left:50%;bottom:-32px;transform:translateX(-50%);padding:5px 10px;background:rgba(9,8,6,.92);border:1px solid var(--line);color:var(--pale);font:11px var(--sans);letter-spacing:.12em;white-space:nowrap;opacity:0;transition:opacity .2s}
.door-target:hover span,.door-target:focus-visible span{opacity:1}
.door-one{left:2%}.door-two{left:35%}.door-three{right:2%}
.intro{max-width:900px;margin:0 auto;padding:clamp(64px,9vw,112px) 24px 58px;text-align:center}
.eyebrow{font:10px var(--sans);letter-spacing:.38em;color:var(--gold2);text-transform:uppercase}
.intro h1{font-size:clamp(24px,4vw,38px);font-weight:400;letter-spacing:.28em;margin:18px 0 20px;color:var(--pale)}
.intro p{max-width:620px;margin:0 auto;color:#e8dcc5;-webkit-text-stroke:.22px rgba(196,163,107,.72);font-weight:300;font-size:14px;line-height:2.2;letter-spacing:.11em;text-shadow:0 0 8px rgba(196,163,107,.16),0 2px 14px rgba(0,0,0,.92)}
.ornament{display:flex;align-items:center;justify-content:center;gap:14px;margin:28px auto 0;color:var(--gold2)}
.ornament:before,.ornament:after{content:"";width:54px;height:1px;background:var(--line)}
.atelier-entry{max-width:760px;margin:0 auto clamp(76px,10vw,124px);padding:0 24px;text-align:center}
.atelier-entry-card{position:relative;overflow:hidden;padding:clamp(28px,5vw,46px) 24px;border:1px solid rgba(196,163,107,.42);background:radial-gradient(ellipse at 50% 0%,rgba(129,96,49,.19),transparent 72%),linear-gradient(155deg,rgba(18,25,39,.96),rgba(8,12,21,.98));box-shadow:0 18px 54px rgba(0,0,0,.28),inset 0 0 32px rgba(196,163,107,.035)}
.atelier-entry-card:before,.atelier-entry-card:after{content:"✦";position:absolute;top:18px;color:rgba(218,185,126,.72);font-size:12px;text-shadow:0 0 16px rgba(218,185,126,.5)}
.atelier-entry-card:before{left:22px}.atelier-entry-card:after{right:22px}
.atelier-entry .eyebrow{display:block}
.atelier-entry h2{font-size:clamp(19px,3vw,27px);font-weight:400;letter-spacing:.2em;color:var(--pale);margin:13px 0 10px}
.atelier-entry p{max-width:520px;margin:0 auto 24px;color:#e8dcc5;-webkit-text-stroke:.2px rgba(196,163,107,.68);font-weight:300;font-size:13px;line-height:2;letter-spacing:.1em;text-shadow:0 0 8px rgba(196,163,107,.16),0 2px 14px rgba(0,0,0,.92)}
.atelier-link{display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border:1px solid rgba(218,185,126,.68);background:rgba(196,163,107,.08);color:var(--pale);font-size:12px;letter-spacing:.18em;text-decoration:none;transition:background .2s,border-color .2s,box-shadow .2s,transform .2s}
.atelier-link:after{content:"↗";font-size:14px;color:var(--gold2)}
.atelier-link:hover,.atelier-link:focus-visible{background:rgba(196,163,107,.17);border-color:var(--gold2);box-shadow:0 0 24px rgba(196,163,107,.16);transform:translateY(-2px);outline:none}
.portals{max-width:1160px;margin:0 auto;padding:20px 28px 100px}
.section-head{text-align:center;margin-bottom:34px}
.section-head h2{font-size:19px;font-weight:400;letter-spacing:.3em;margin:0 0 12px}
.section-head p{font:11px/1.8 var(--sans);letter-spacing:.12em;color:var(--muted);margin:0}
.portal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.portal{
  position:relative;min-height:260px;padding:32px 25px 26px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  border:1px solid var(--line);background:
  radial-gradient(ellipse at 50% 0%,rgba(129,96,49,.14),transparent 65%),
  linear-gradient(160deg,rgba(32,25,16,.82),rgba(11,10,8,.98));
  transition:transform .25s,border-color .25s,background .25s
}
.portal:hover{transform:translateY(-5px);border-color:rgba(196,163,107,.7)}
.portal-symbol{width:54px;height:54px;border:1px solid var(--gold2);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:23px;margin-bottom:20px}
.portal h3{font-size:18px;font-weight:400;letter-spacing:.2em;margin:0 0 8px}
.portal .en{font:10px var(--sans);letter-spacing:.2em;color:var(--gold2)}
.portal p{font-size:13px;line-height:1.9;color:var(--muted);margin:20px 0 24px;min-height:50px}
.portal button{margin-top:auto;border:1px solid var(--line);background:transparent;color:var(--pale);padding:10px 22px;letter-spacing:.16em;font-size:12px;cursor:pointer;transition:background .2s,border-color .2s}
.portal button:hover,.portal button:focus-visible{background:rgba(196,163,107,.12);border-color:var(--gold);outline:none}
.detail{max-width:900px;margin:0 auto 100px;padding:0 24px;scroll-margin-top:88px}
.detail-panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(31,24,15,.72),rgba(10,9,7,.96));padding:clamp(28px,5vw,54px);text-align:center}
.detail-panel.scene-panel{position:relative;isolation:isolate;overflow:hidden;min-height:540px;display:flex;flex-direction:column;justify-content:center;background:#090806}
.detail-panel.scene-panel::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,7,5,.42),rgba(8,7,5,.82) 78%,rgba(8,7,5,.96))}
.detail-panel.scene-panel>*{position:relative;z-index:1}
.detail-panel .scene-backdrop{position:absolute!important;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;z-index:-2!important;opacity:.78}
@media(max-width:760px){.detail-panel.scene-panel{min-height:460px}.detail-panel .scene-backdrop{object-position:center 35%}}
.detail-panel[hidden]{display:none}
.detail-kicker{font:10px var(--sans);letter-spacing:.32em;color:var(--gold2)}
.detail-panel h2{font-size:clamp(20px,3vw,28px);font-weight:400;letter-spacing:.22em;margin:14px 0}
.detail-panel p{max-width:620px;margin:0 auto;color:var(--muted);font-size:14px;line-height:2}
.empty-state{margin:28px auto 0;padding:18px;border-top:1px solid var(--line);max-width:520px;color:#8d806b;font-size:12px;line-height:1.9}
.close-detail{margin-top:24px;background:transparent;border:0;color:var(--gold);cursor:pointer;letter-spacing:.15em;font-size:12px;padding:8px 14px}
.footer{border-top:1px solid rgba(196,163,107,.16);padding:28px 20px 34px;text-align:center;color:#766a57;font:10px/2 var(--sans);letter-spacing:.18em}
.footer .seal{display:block;color:var(--gold2);font:18px var(--serif);margin-bottom:8px}
@media(max-width:760px){
  .site-header{height:60px}
  .menu-toggle{display:block}
  .nav{display:none;position:absolute;top:59px;left:0;right:0;padding:18px 22px 22px;background:rgba(9,8,6,.98);border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:18px}
  .nav.open{display:flex}
  .door-target{top:63%;height:19%;width:31%}
  .door-one{left:0.5%}.door-two{left:34.5%}.door-three{right:0.5%}
  .portal-grid{grid-template-columns:1fr;max-width:520px;margin:auto;gap:14px}
  .portal{min-height:220px}
  .portal p{min-height:0}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}}

/* MOON SANCTUARY — quiet, responsive light rather than solid hover blocks */
:root{
  --bg:#070d18;--panel:#0b1422;--panel2:#101d2d;
  --gold:#d5bd8a;--gold2:#927c57;--pale:#e8e4d9;
  --muted:#a3a9b2;--line:rgba(194,174,132,.24);
  --moon:#c8d1dc;--glow:rgba(211,190,145,.42);
}
body{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(70,91,119,.17),transparent 46rem),
    radial-gradient(ellipse at 50% 58%,rgba(25,43,66,.20),transparent 52rem),
    var(--bg);
}
.site-header{
  background:rgba(6,12,22,.78);
  border-bottom-color:rgba(194,174,132,.18);
  box-shadow:0 8px 34px rgba(0,0,0,.18);
}
.brand-mark{
  border-color:rgba(202,188,157,.58);
  color:var(--moon);
  box-shadow:inset 0 0 13px rgba(196,205,218,.08),0 0 16px rgba(196,205,218,.06);
}
.nav a{position:relative;transition:color .35s,text-shadow .35s}
.nav a::after{
  content:"";position:absolute;left:0;right:100%;bottom:-8px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  transition:right .45s ease;
}
.nav a:hover,.nav a:focus-visible{color:#f1e5c9;text-shadow:0 0 13px var(--glow)}
.nav a:hover::after,.nav a:focus-visible::after{right:0}
.hero{background:linear-gradient(180deg,#070d18,#090f1a)}
.hero-inner::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,13,24,.02) 62%,rgba(7,13,24,.28));
}
.door-target{
  background:transparent!important;border:1px solid transparent!important;
  box-shadow:none!important;border-radius:50%;
  transition:filter .5s ease,transform .5s ease;
}
.door-target::before{
  content:"";position:absolute;inset:14% 23%;border:1px solid rgba(211,190,145,0);
  border-radius:50%;opacity:0;transform:scale(.92);
  transition:opacity .55s ease,transform .65s ease,border-color .55s ease;
  box-shadow:0 0 22px rgba(211,190,145,0);
}
.door-target::after{
  content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;
  border-radius:50%;background:var(--gold);opacity:0;
  transform:translate(-50%,-50%) scale(.4);
  box-shadow:0 0 9px 3px rgba(211,190,145,.5),0 0 25px 7px rgba(211,190,145,.2);
  transition:opacity .4s ease,transform .55s ease;
}
.door-target:hover,.door-target:focus-visible{
  background:transparent!important;border-color:transparent!important;
  filter:drop-shadow(0 0 10px rgba(211,190,145,.14));
}
.door-target:hover::before,.door-target:focus-visible::before{
  opacity:1;transform:scale(1);border-color:rgba(211,190,145,.38);
  box-shadow:0 0 22px rgba(211,190,145,.08),inset 0 0 18px rgba(211,190,145,.05);
}
.door-target:hover::after,.door-target:focus-visible::after{
  opacity:.9;transform:translate(-50%,-50%) scale(1);
}
.door-target span{
  bottom:-35px;background:rgba(7,13,24,.82);border:0;
  border-bottom:1px solid rgba(211,190,145,.48);
  color:#eee4cf;letter-spacing:.2em;
  text-shadow:0 0 12px rgba(211,190,145,.25);
}
.intro{position:relative}
.eyebrow,.detail-kicker{color:#b5a17b}
.intro h1,.section-head h2,.detail-panel h2{color:#eee8dc}
.ornament{color:#c7b58e;text-shadow:0 0 14px rgba(211,190,145,.3)}
.ornament:before,.ornament:after{
  background:linear-gradient(90deg,transparent,rgba(211,190,145,.52),transparent)
}
.portal-grid{gap:clamp(20px,3vw,38px)}
.portal{
  min-height:270px;padding:36px 25px 30px;
  border:1px solid rgba(194,174,132,.16);
  background:
    radial-gradient(ellipse at 50% 0%,rgba(151,133,99,.10),transparent 68%),
    linear-gradient(160deg,rgba(18,30,47,.45),rgba(7,13,24,.2));
  transition:border-color .55s ease,background .55s ease,transform .55s ease;
}
.portal::before,.detail-panel:not(.scene-panel)::before{
  content:"";position:absolute;inset:8px;pointer-events:none;
  border:1px solid rgba(211,190,145,0);transition:border-color .55s ease;
}
.portal:hover{
  transform:translateY(-2px);
  border-color:rgba(211,190,145,.42);
  background:
    radial-gradient(ellipse at 50% 0%,rgba(151,133,99,.17),transparent 68%),
    linear-gradient(160deg,rgba(22,36,55,.62),rgba(7,13,24,.32));
}
.portal:hover::before{border-color:rgba(211,190,145,.12)}
.portal-symbol{
  position:relative;border-color:rgba(190,177,146,.5);color:#d6c49b;
  box-shadow:inset 0 0 16px rgba(200,209,220,.05);
  transition:transform .8s ease,box-shadow .6s ease,color .6s ease;
}
.portal-symbol::after{
  content:"";position:absolute;inset:-6px;border:1px solid rgba(211,190,145,0);
  border-radius:50%;transform:rotate(-28deg) scale(.9);
  transition:transform .9s ease,border-color .6s ease;
}
.portal:hover .portal-symbol{
  color:#f0dfb8;transform:translateY(-2px);
  box-shadow:inset 0 0 18px rgba(200,209,220,.12),0 0 22px rgba(211,190,145,.12);
}
.portal:hover .portal-symbol::after{
  border-color:rgba(211,190,145,.38);transform:rotate(35deg) scale(1.08);
}
.portal button{
  position:relative;border:0;border-bottom:1px solid rgba(211,190,145,.36);
  background:transparent;color:#e6dcc8;padding:11px 8px 9px;
  letter-spacing:.2em;transition:color .4s ease,text-shadow .4s ease,border-color .4s ease;
}
.portal button::after{
  content:"";position:absolute;left:50%;right:50%;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,#f1dba8,transparent);
  transition:left .45s ease,right .45s ease;
}
.portal button:hover,.portal button:focus-visible{
  background:transparent;border-color:rgba(241,219,168,.68);
  color:#fff1d0;text-shadow:0 0 14px rgba(211,190,145,.32);outline:none;
}
.portal button:hover::after,.portal button:focus-visible::after{left:0;right:0}
.detail-panel{
  position:relative;border-color:rgba(194,174,132,.22);
  background:linear-gradient(145deg,rgba(19,31,48,.74),rgba(7,13,24,.96));
}
.close-detail{
  border-bottom:1px solid rgba(211,190,145,.32);
  transition:color .4s ease,text-shadow .4s ease;
}
.close-detail:hover,.close-detail:focus-visible{
  color:#fff0cb;text-shadow:0 0 14px rgba(211,190,145,.3);outline:none;
}
.footer{border-top-color:rgba(194,174,132,.16)}
.footer .seal{color:#b9a77f;text-shadow:0 0 14px rgba(211,190,145,.22)}
@keyframes moonline{
  0%{background-position:180% 0}
  100%{background-position:-180% 0}
}
@media(prefers-reduced-motion:no-preference){
  .portal:hover .portal-symbol::after{animation:moonline 2.8s ease-in-out infinite}

/* A single fixed midnight-blue sky keeps every section connected without tiled seams. */
:root{--bg:#07152a;--panel:rgba(7,18,36,.18);--gold:#d5bd8a;--gold2:#a98e5d;--pale:#eee7d7;--muted:#c4bdaf;--line:rgba(213,189,138,.28)}
html,body{background:#07152a}
body{position:relative;isolation:isolate}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none}
body::before{z-index:-2}
body::after{z-index:-1;background:linear-gradient(180deg,rgba(4,12,26,.18),rgba(4,12,26,.34) 58%,rgba(4,12,26,.48))}
.site-header{background:rgba(7,18,36,.24);backdrop-filter:blur(3px);border-bottom-color:rgba(213,189,138,.22)}
.brand-mark-image{display:block;width:76px;height:auto;filter:drop-shadow(0 0 7px rgba(213,189,138,.26))}
.nav a.image-link{display:inline-flex;align-items:center;justify-content:center;transition:transform .32s ease,filter .32s ease}
.nav a.image-link:hover,.nav a.image-link:focus-visible{transform:scale(1.08);filter:drop-shadow(0 0 8px rgba(226,197,137,.78)) drop-shadow(0 0 16px rgba(226,197,137,.28));outline:none}
.nav-wordmark{display:block;width:clamp(74px,9vw,122px);max-height:38px;object-fit:contain}
.hero{background:transparent}
.door-target{display:block}
.door-target span{padding:0;background:transparent;border:0}
.door-target:hover span,.door-target:focus-visible span{transform:translateX(-50%) scale(1.06);filter:drop-shadow(0 0 10px rgba(226,197,137,.8))}
.door-wordmark{display:block;width:clamp(112px,17vw,200px);height:auto;max-height:76px;object-fit:contain}
.intro h1,.section-head h2{color:var(--pale);text-shadow:0 2px 14px rgba(0,0,0,.78)}
.intro-title{display:block;width:min(760px,82vw);height:auto;max-height:220px;object-fit:contain;margin:18px auto 22px;filter:drop-shadow(0 0 8px rgba(213,189,138,.2))}
.intro p,.atelier-entry p,.section-head p{color:rgba(238,231,215,.88);text-shadow:0 2px 14px rgba(0,0,0,.9)}
.atelier-entry-card{border:0;background:transparent;box-shadow:none}
.atelier-title-link{display:inline-flex;align-items:center;justify-content:center;margin:2px auto 14px;transition:transform .32s ease,filter .32s ease}
.atelier-title-crop{display:block;width:min(620px,76vw);aspect-ratio:1200/310;overflow:hidden}
.atelier-title-crop img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.atelier-title-link:hover,.atelier-title-link:focus-visible{transform:scale(1.035);filter:drop-shadow(0 0 12px rgba(226,197,137,.72));outline:none}
.humor-line{margin:22px auto 10px;color:var(--gold);font-size:13px;letter-spacing:.12em;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.footer{position:relative;background:transparent;color:rgba(238,231,215,.68);border-top-color:rgba(213,189,138,.2)}
@media(max-width:760px){
  .site-header{background:rgba(7,18,36,.22)}
  .brand-mark-image{width:58px}
  .nav-wordmark{width:clamp(70px,18vw,106px);max-height:34px}
  .door-wordmark{width:clamp(78px,21vw,126px);max-height:48px}
}

/* Let the sky show through the navigation and brighten the delicate gold wordmarks. */
.site-header{height:76px;background:rgba(7,18,36,.06);backdrop-filter:none;border-bottom-color:rgba(213,189,138,.14)}
.brand{gap:10px;min-width:0;text-decoration:none}
.brand-moon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border:1px solid rgba(213,189,138,.58);border-radius:50%;color:#ead7a9;font:23px/1 Georgia,serif;text-shadow:0 0 9px rgba(231,205,151,.65);box-shadow:inset 0 0 12px rgba(213,189,138,.08),0 0 12px rgba(213,189,138,.13)}
.brand-name{display:block;color:#e7d6aa;font:12px var(--serif);letter-spacing:.11em;white-space:nowrap;text-shadow:0 0 8px rgba(231,205,151,.42),0 1px 5px rgba(0,0,0,.75)}
.nav-wordmark{width:clamp(80px,9.5vw,130px);max-height:44px;filter:brightness(1.28) drop-shadow(.45px 0 rgba(231,205,151,.82)) drop-shadow(-.45px 0 rgba(231,205,151,.82)) drop-shadow(0 .45px rgba(231,205,151,.7)) drop-shadow(0 -.45px rgba(231,205,151,.7)) drop-shadow(0 0 5px rgba(231,205,151,.48)) drop-shadow(0 0 13px rgba(213,189,138,.18))}
.brand-name{font-size:14px;letter-spacing:.12em}
.nav-link{display:inline-flex;align-items:center;justify-content:center;color:#e8d4a4!important;font:400 15px/1.3 var(--serif)!important;letter-spacing:.12em!important;white-space:nowrap;text-shadow:.35px 0 rgba(231,205,151,.72),-.35px 0 rgba(231,205,151,.72),0 0 8px rgba(231,205,151,.42),0 1px 5px rgba(0,0,0,.8);transition:transform .3s ease,filter .3s ease,color .3s ease}
.nav-link:hover,.nav-link:focus-visible{transform:scale(1.06);color:#fff0c8!important;filter:drop-shadow(0 0 8px rgba(231,205,151,.72));outline:none}
.door-label{color:#ead7a9;font:13px var(--serif);letter-spacing:.14em;text-shadow:0 0 10px rgba(231,205,151,.64),0 2px 8px rgba(0,0,0,.9)}
.atelier-title-link .atelier-title-crop{width:min(650px,78vw)}
.intro-copy-art,.atelier-copy-art{display:block;width:min(790px,86vw);height:auto;margin:14px auto 0;filter:drop-shadow(0 1px 9px rgba(0,0,0,.5))}
.atelier-copy-art{width:min(720px,82vw);margin:0 auto}
.nav a.image-link:hover,.nav a.image-link:focus-visible{filter:brightness(1.34) drop-shadow(0 0 9px rgba(241,219,168,.78)) drop-shadow(0 0 18px rgba(226,197,137,.34))}

/* Feather the sanctuary artwork into the same nebula instead of leaving hard image edges. */
.hero-art{
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(0deg,transparent 0,#000 12%,#000 88%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(0deg,transparent 0,#000 12%,#000 88%,transparent 100%);
  mask-composite:intersect;
}
.hero-inner::after{z-index:2;background:linear-gradient(90deg,rgba(7,13,24,.94) 0,transparent 10%,transparent 90%,rgba(7,13,24,.94) 100%),linear-gradient(180deg,rgba(7,13,24,.38) 0,transparent 12%,transparent 82%,rgba(7,13,24,.92) 100%)}
.nav-link:hover,.nav-link:focus-visible,.menu-toggle:hover,.menu-toggle:focus-visible,.atelier-link{color:var(--animal)!important;border-color:color-mix(in srgb,var(--animal) 62%,transparent)!important}
.site-header{border-bottom:1px solid color-mix(in srgb,var(--animal) 44%,transparent);box-shadow:0 5px 24px -15px var(--animal-soft)}
.brand-moon{border-color:var(--animal);color:var(--animal);box-shadow:inset 0 0 14px var(--animal-soft),0 0 14px var(--animal-soft);text-shadow:0 0 12px var(--animal-soft)}
.menu-toggle,.portal-symbol{border-color:color-mix(in srgb,var(--animal) 68%,transparent);color:var(--animal);box-shadow:0 0 12px var(--animal-soft)}
.atelier-link{box-shadow:0 0 15px var(--animal-soft)}
</style>
