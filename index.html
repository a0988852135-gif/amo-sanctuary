<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090806">
<title>AMO｜神諭殿堂</title>
<style>
  :root{
    --bg:#090806; --gold:#b99a63; --gold-soft:#8f754b;
    --ivory:#d9cbb2; --line:rgba(185,154,99,.34);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ivory);
       font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
  .hero{width:100%;background:#090806;line-height:0}
  .hero img{display:block;width:100%;height:auto;margin:0 auto}
  .features{
    width:min(1180px, calc(100% - 48px)); margin:0 auto;
    padding:clamp(42px,7vw,88px) 0 90px;
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;
  }
  .feature{
    min-height:230px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:34px 20px;
    border:1px solid var(--line);border-radius:2px;
    background:linear-gradient(160deg,rgba(55,42,27,.42),rgba(10,9,7,.92));
    color:var(--ivory);cursor:pointer;transition:border-color .3s,background .3s,transform .3s;
  }
  .feature:hover{border-color:rgba(210,178,117,.8);background:linear-gradient(160deg,rgba(88,65,37,.42),rgba(10,9,7,.94));transform:translateY(-4px)}
  .sigil{font-size:34px;color:var(--gold);margin-bottom:18px;line-height:1}
  .feature h2{font-size:clamp(18px,2vw,24px);font-weight:400;letter-spacing:.16em;margin:0 0 10px}
  .feature p{font:12px/1.8 sans-serif;letter-spacing:.18em;color:#9c8b70;margin:0}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;
    align-items:center;justify-content:center;padding:22px;z-index:10}
  .modal-backdrop.open{display:flex}
  .modal{width:min(680px,100%);min-height:260px;position:relative;padding:54px 34px 38px;
    background:linear-gradient(145deg,#211a12,#0b0907 72%);border:1px solid var(--gold-soft);
    box-shadow:0 18px 80px rgba(0,0,0,.7);text-align:center}
  .modal h2{font-weight:400;letter-spacing:.2em;color:var(--gold);margin:0 0 22px}
  .modal p{color:#c2b49a;line-height:1.9;margin:0}
  .close{position:absolute;right:16px;top:12px;border:0;background:none;color:#c7b58f;
    font-size:28px;cursor:pointer}
  footer{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);width:70%;margin:0 auto 36px}
  @media(max-width:760px){.features{grid-template-columns:1fr;width:min(520px,calc(100% - 32px));gap:14px}.feature{min-height:170px}}
</style>
</head>
<body>
  <main>
    <section class="hero" aria-label="AMO 神諭殿堂首頁主視覺">
      <img src="https://drive.google.com/thumbnail?id=1t4cxS507buaZdjvEPldY3_Z_eEgBDjXK&sz=w2000"
           alt="AMO 神諭殿堂主視覺">
    </section>

    <section class="features" aria-label="創作內容">
      <button class="feature" data-title="貼圖・作品" data-copy="這裡將展示 AMO 的原創貼圖與視覺作品。">
        <span class="sigil">✧</span><h2>貼圖・作品</h2><p>ORIGINAL WORKS</p>
      </button>
      <button class="feature" data-title="影音・YouTube" data-copy="這裡將收錄 AMO 的影片與影音創作。">
        <span class="sigil">◉</span><h2>影音・YouTube</h2><p>VIDEO ARCHIVE</p>
      </button>
      <button class="feature" data-title="音樂・Suno" data-copy="這裡將展示 AMO 的 AI 音樂作品與歌曲。">
        <span class="sigil">♫</span><h2>音樂・Suno</h2><p>AI MUSIC LAB</p>
      </button>
    </section>
    <footer></footer>
  </main>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <button class="close" aria-label="關閉" id="close">×</button>
      <h2 id="modal-title"></h2><p id="modal-copy"></p>
    </div>
  </div>
<script>
  const modal=document.getElementById('modal');
  const title=document.getElementById('modal-title');
  const copy=document.getElementById('modal-copy');
  document.querySelectorAll('.feature').forEach(button=>{
    button.addEventListener('click',()=>{
      title.textContent=button.dataset.title;
      copy.textContent=button.dataset.copy;
      modal.classList.add('open');
    });
  });
  document.getElementById('close').addEventListener('click',()=>modal.classList.remove('open'));
  modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
</script>
</body>
</html>
