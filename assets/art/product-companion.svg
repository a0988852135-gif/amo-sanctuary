<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" role="img" aria-labelledby="t"><title id="t">毛陪陪視線支架。依毛孩體型與居家設備高度安排，讓你遊戲時也能一眼看見身旁的小小隊友。依尺寸與材質報價。</title><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ad8b50"/><stop offset=".5" stop-color="#f3e3b5"/><stop offset="1" stop-color="#ad8b50"/></linearGradient></defs><path d="M150 36h155m490 0h155" fill="none" stroke="url(#g)" opacity=".66"/><text x="550" y="83" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="38" letter-spacing="6">毛陪陪視線支架</text><text x="550" y="139" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="23" letter-spacing="1">依毛孩體型與設備高度調整，陪牠待在你身邊</text><text x="550" y="180" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="23" letter-spacing="2">遊戲途中，也能一眼看見小小隊友</text><text x="550" y="224" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="18" letter-spacing="4">依尺寸與材質報價</text></svg>
