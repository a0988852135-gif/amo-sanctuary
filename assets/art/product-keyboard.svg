<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" role="img" aria-labelledby="t d">
<title id="t">星月訂製鍵盤</title>
<desc id="d">依守護動物選擇低飽和色彩、木作太陽支架或金屬月亮支架。</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ad8b50"/><stop offset=".5" stop-color="#f3e3b5"/><stop offset="1" stop-color="#ad8b50"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<path d="M125 58h180m490 0h180" fill="none" stroke="url(#g)" stroke-width="1.3" opacity=".72"/>
<path d="m550 31 7 12 14 2-10 10 2 14-13-7-13 7 2-14-10-10 14-2Z" fill="none" stroke="url(#g)" stroke-width="1.1" opacity=".72"/>
<text x="550" y="132" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC, Songti TC, serif" font-size="45" letter-spacing="9" filter="url(#soft)">星月訂製鍵盤</text>
<text x="550" y="181" text-anchor="middle" fill="#e9d8ad" font-family="Noto Serif TC, Songti TC, serif" font-size="19" letter-spacing="4">草食・鏤空木作太陽　｜　肉食・月亮金屬</text>
<path d="M400 207q150 18 300 0" fill="none" stroke="url(#g)" stroke-width="1" opacity=".48"/>
</svg>
