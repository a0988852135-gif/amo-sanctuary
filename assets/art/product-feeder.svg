<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" role="img" aria-labelledby="t"><title id="t">星流照護餵食器。自動補糧、補水與清潔概念整合，外觀可配合家中設備與守護動物色系訂製。依容量與功能報價。</title><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ad8b50"/><stop offset=".5" stop-color="#f3e3b5"/><stop offset="1" stop-color="#ad8b50"/></linearGradient></defs><path d="M150 36h155m490 0h155" fill="none" stroke="url(#g)" opacity=".66"/><text x="550" y="83" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="38" letter-spacing="6">星流照護餵食器</text><text x="550" y="139" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="23" letter-spacing="1">整合自動補糧、補水與清潔概念</text><text x="550" y="180" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="23" letter-spacing="2">外觀與容量可配合寵物及居家空間訂製</text><text x="550" y="224" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="18" letter-spacing="4">依容量與功能報價</text></svg>
