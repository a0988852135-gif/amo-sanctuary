<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" role="img" aria-labelledby="t"><title id="t">月芽電競椅。月弧靠背、客製飾面與設備連接構想，還可搭配全息頭盔連接功能。依客製內容報價。</title><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ad8b50"/><stop offset=".5" stop-color="#f3e3b5"/><stop offset="1" stop-color="#ad8b50"/></linearGradient></defs><path d="M150 36h155m490 0h155" fill="none" stroke="url(#g)" opacity=".66"/><text x="550" y="83" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="38" letter-spacing="6">月芽電競椅</text><text x="550" y="139" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="23" letter-spacing="1">月弧椅背與客製飾面，可串接全套電競設備</text><text x="550" y="180" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="23" letter-spacing="2">並預留全息頭盔連接功能構想</text><text x="550" y="224" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="18" letter-spacing="4">依客製內容報價</text></svg>
