<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" role="img" aria-labelledby="t"><title id="t">喵眠艙。月牙艙體延伸成人與貓咪都能安歇的尺寸，布料、內襯與光色皆可依陪伴習慣訂製。依尺寸與材質報價。</title><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ad8b50"/><stop offset=".5" stop-color="#f3e3b5"/><stop offset="1" stop-color="#ad8b50"/></linearGradient></defs><path d="M150 36h155m490 0h155" fill="none" stroke="url(#g)" opacity=".66"/><text x="550" y="83" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="38" letter-spacing="8">喵眠艙</text><text x="550" y="139" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="23" letter-spacing="1">月牙艙體為人與貓咪延伸舒適尺寸，內襯與光色可選</text><text x="550" y="180" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="23" letter-spacing="2">依照日常陪伴習慣細緻訂製</text><text x="550" y="224" text-anchor="middle" fill="url(#g)" font-family="Noto Serif TC,BiauKai,KaiTi,serif" font-size="18" letter-spacing="4">依尺寸與材質報價</text></svg>
